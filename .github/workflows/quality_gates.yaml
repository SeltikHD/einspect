name: Flutter Quality Gates

on:
    pull_request:
        branches: [main, develop]
    push:
        branches: [main, develop]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # --------------------------------------------------------
    # 1. SECURITY & STATIC ANALYSIS
    # --------------------------------------------------------
    static_analysis_and_security:
        name: Code Analysis & Security Gates
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # Gate 1.1
            - name: Secret Detection (Gitleaks)
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: "stable"
                  cache: true

            - name: Install Dependencies
              run: flutter pub get

            # Gate 1.2
            - name: Flutter Analyze
              run: flutter analyze --fatal-infos --fatal-warnings

            # Gate 1.3
            - name: Check Formatting
              run: dart format --output=none --set-exit-if-changed .

    # --------------------------------------------------------
    # 2. UNIT TESTS, SQLITE & SYNC TESTS
    # --------------------------------------------------------
    unit_and_sync_tests:
        name: Unit, SQLite & Sync Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: "stable"
                  cache: true

            - name: Install Dependencies
              run: flutter pub get

            # Gate 2.1
            - name: Run Tests with Coverage
              run: flutter test --coverage

            # Gate 2.2
            - name: Check Code Coverage Threshold
              uses: VeryGoodOpenSource/very_good_coverage@v3
              with:
                  path: "./coverage/lcov.info"
                  min_coverage: 80
                  exclude: "**/*.g.dart **/*.freezed.dart"

    # --------------------------------------------------------
    # 3. BUILD & SIZE GATE
    # --------------------------------------------------------
    build_gate:
        name: Build & Size Gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Java 17
              uses: actions/setup-java@v4
              with:
                  distribution: "zulu"
                  java-version: "17"

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: "stable"
                  cache: true

            - name: Install Dependencies
              run: flutter pub get

            # Gate 3.1
            - name: Build Android Release
              run: flutter build apk --debug

            # Gate 3.2
            - name: Check App Size Delta
              shell: bash
              run: |
                set -euo pipefail
                apk="build/app/outputs/flutter-apk/app-debug.apk"
                max_size_mb=50

                [[ -f "$apk" ]] || {
                  echo "::error::APK was not generated at $apk"
                  exit 1
                }

                size_bytes=$(stat -c%s "$apk")
                size_mb=$(( (size_bytes + 1024 * 1024 - 1) / (1024 * 1024) ))

                echo "APK size: ${size_mb} MiB (${size_bytes} bytes)"

                if (( size_mb > max_size_mb )); then
                  echo "::error::APK exceeds the ${max_size_mb} MiB limit"
                  exit 1
                fi

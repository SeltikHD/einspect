org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Disables the persistent background Gradle process that stays in memory after builds.
# On Windows, this daemon often holds onto file locks, causing cache corruption issues.
org.gradle.daemon=false

# Forces submodules and plugins to build sequentially instead of concurrently.
# Eliminates race conditions where multiple plugins access the same cache directory simultaneously.
org.gradle.parallel=false

# Disables Kotlin's incremental compilation, forcing clean rebuilds of native code.
# Prevents read/write failures on cache index files (.tab) between Java and Kotlin.
kotlin.incremental=false

# Runs the Kotlin compiler directly inside the Gradle JVM process instead of spawning a separate daemon.
# Avoids memory leaks and IPC communication failures between separate compilation processes.
kotlin.compiler.execution.strategy=in-process